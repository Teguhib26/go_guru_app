name: go_guru_app
description: "GO GURU - FE REV 1235 - Aplikasi Mencari Guru Musik Privat"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_preview: ^1.1.0
  video_player: ^2.9.2
  provider: ^6.1.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/LOGO.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/LOGO.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
